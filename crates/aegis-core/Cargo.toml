[package]
name = "aegis-core"
description = "Aegis shared trust vocabulary: provenance, tagged values, capability (Rule of Two)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ed25519-dalek = { workspace = true, optional = true }

[features]
# Ed25519 signing primitives for the Agentic/ASI crates (mesh/identity/intent). Off by default
# so the consequence-side crates (broker/output/egress/…) don't pull the crypto tree.
crypto = ["dep:ed25519-dalek"]
